name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies and run checks
        run: |
          cd sre-suite-frontend
          npm ci
          npm run check
          npm test

      - name: Build Next.js
        run: |
          cd sre-suite-frontend
          npm run build
