services:
  - type: web
    name: sre-suite-frontend
    env: node
    repo: https://github.com/rushangbagada/Coral-Bean
    branch: main
    buildCommand: cd sre-suite-frontend && npm ci && npm run build
    startCommand: cd sre-suite-frontend && npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
